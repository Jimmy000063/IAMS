# OPTIONAL. The project's default is a locally installed PostgreSQL on 5432,
# set up by `infra/postgres/local-setup.sql` - see docs/setup.md.
#
# This file remains for anyone who would rather not install PostgreSQL on their
# machine. If you use it, change `backend/.env` to port 5433 and user `iams`,
# and set IAMS_TEST_DATABASE_URL to the 5434 container, because nothing here
# matches the defaults any more.

name: iams

services:
  postgres:
    image: postgres:17-alpine
    container_name: iams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iams}
      POSTGRES_USER: ${POSTGRES_USER:-iams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iams_local_dev}
      # Deterministic collation and UTC, so that sorting and timestamp handling
      # match between a developer machine and a deployed environment.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      # Published on 5433 so it cannot collide with a PostgreSQL already
      # installed on the host's default 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iams} -d ${POSTGRES_DB:-iams}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Test database. Kept separate from the development database so that running
  # the suite never truncates data a developer is working with.
  postgres-test:
    image: postgres:17-alpine
    container_name: iams-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: iams_test
      POSTGRES_USER: iams
      POSTGRES_PASSWORD: iams_local_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      # Test data is disposable; keeping it in memory makes the suite faster and
      # guarantees a clean slate when the container restarts.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iams -d iams_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: iams_postgres_data
