[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The database URL is NOT set here. It is read from the environment by
# alembic/env.py via the application settings, so that no credential is ever
# committed to source control.

# Revision filenames: 0001_description.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Intentionally empty. Formatting a generated revision is done explicitly with
# `ruff format alembic/versions` as part of the workflow, rather than via a hook
# whose resolution of the `ruff` executable differs between machines and
# virtualenv layouts.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
